<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Granite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar rail + panel -->
    <aside id="sidebar" class="expanded">
      <div id="sidebar-rail">
        <button id="brand-mark" title="Granite">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="1" y="1" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.9"/>
            <rect x="11" y="1" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.5"/>
            <rect x="1" y="11" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.5"/>
            <rect x="11" y="11" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.3"/>
          </svg>
        </button>
        <button id="rail-search" class="rail-btn" title="Search (⌘K)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="7" cy="7" r="4.5"/>
            <path d="M10.5 10.5L14 14"/>
          </svg>
        </button>
        <button id="rail-graph" class="rail-btn" title="Graph (⌘G)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="4" cy="4" r="2"/>
            <circle cx="12" cy="4" r="2"/>
            <circle cx="8" cy="13" r="2"/>
            <path d="M5.5 5.5L7 11M10.5 5.5L9 11M6 4h4"/>
          </svg>
        </button>
        <button id="rail-new" class="rail-btn" title="New note (⌘N)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M8 3v10M3 8h10"/>
          </svg>
        </button>
        <div style="flex:1"></div>
        <button id="rail-toggle" class="rail-btn" title="Toggle sidebar">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="1" y="2" width="14" height="12" rx="2"/>
            <path d="M5.5 2v12"/>
          </svg>
        </button>
      </div>
      <div id="sidebar-panel">
        <!-- Search -->
        <div id="sidebar-search">
          <div id="search-wrapper">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
              <circle cx="7" cy="7" r="4.5"/>
              <path d="M10.5 10.5L14 14"/>
            </svg>
            <input type="text" id="search-box" placeholder="Search…" autocomplete="off" spellcheck="false">
            <kbd>⌘K</kbd>
          </div>
        </div>
        <div id="type-filters">
          <button class="type-chip active" data-type="">All</button>
        </div>

        <!-- Note list (default view) -->
        <div id="note-list"></div>

        <!-- Creation panel (hidden by default) -->
        <div id="create-panel" style="display:none">
          <div id="create-panel-header">
            <span class="create-panel-title">New note</span>
            <button id="create-panel-close" class="create-panel-close" title="Cancel">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M4 4l8 8M12 4l-8 8"/>
              </svg>
            </button>
          </div>
          <div id="create-form">
            <label class="create-label">Type</label>
            <select id="create-type" class="create-select"></select>
            <label class="create-label">Title</label>
            <input type="text" id="create-title" class="create-input" placeholder="Note title…" autocomplete="off" spellcheck="false">
            <label class="create-label">Content</label>
            <textarea id="create-body" class="create-textarea" placeholder="Start writing… (markdown supported)" spellcheck="false"></textarea>
            <button id="create-submit" class="create-submit">Create note</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <main id="main">
      <!-- Note view -->
      <div id="content-wrapper">
        <header id="note-header">
          <div id="note-breadcrumb"></div>
          <h1 id="note-title"></h1>
          <div id="note-meta">
            <span id="note-type-badge" class="meta-badge"></span>
            <span id="note-date" class="meta-date"></span>
            <div id="note-tags"></div>
          </div>
        </header>

        <!-- HTML rendered note body (replaces canvas) -->
        <article id="note-body"></article>

        <!-- Backlinks -->
        <section id="backlinks-panel">
          <div id="backlinks-header">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5">
              <path d="M10 2L6 14M4 5L1 8l3 3M12 5l3 3-3 3"/>
            </svg>
            <span id="backlinks-count">0</span> references
          </div>
          <div id="backlinks-list"></div>
        </section>
      </div>

      <!-- Graph view -->
      <div id="graph-view" style="display:none">
        <canvas id="graph-canvas"></canvas>
        <div id="graph-tooltip"></div>
      </div>

      <!-- Empty state -->
      <div id="empty-state">
        <div id="empty-icon">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="0.75" opacity="0.15">
            <circle cx="12" cy="12" r="4"/>
            <circle cx="28" cy="12" r="4"/>
            <circle cx="20" cy="30" r="4"/>
            <path d="M15.5 14L18 26M24.5 14L22 26M16 12h8" stroke-dasharray="2 3"/>
          </svg>
        </div>
        <p>Select a note to begin</p>
        <p class="empty-hint"><kbd>⌘K</kbd> search · <kbd>⌘N</kbd> new note · <kbd>⌘G</kbd> graph</p>
      </div>
    </main>
  </div>

  <!-- Wikilink preview popup -->
  <div id="wikilink-preview" class="wikilink-preview">
    <div class="preview-type"></div>
    <div class="preview-title"></div>
    <div class="preview-snippet"></div>
    <div class="preview-tags"></div>
  </div>

  <script src="/markdown-renderer.js"></script>
  <script src="/graph.js"></script>
  <script src="/app.js"></script>
</body>
</html>
