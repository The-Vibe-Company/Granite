name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run lint
      - name: Install Cloudflare MCP dependencies
        run: npm ci
        working-directory: packages/cloudflare-mcp
      - name: Typecheck Cloudflare MCP
        run: npm run lint
        working-directory: packages/cloudflare-mcp
      - name: Run tests with coverage
        run: npm run test:coverage
